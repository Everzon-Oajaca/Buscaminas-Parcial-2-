<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas 10x10</title>
  <link rel="icon" href="https://emojicdn.elk.sh/%F0%9F%92%A3" type="image/png">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

<h1>BUSCAMINAS</h1>

<div class="top-panel">

  <button id="reset-button">😃</button>
  <div id="timer">000</div>
</div>

<div id="board"></div>


<button id="show-scores-btn" class="modern-btn">🏆 Ver Mejores Tiempos</button>
<button id="ayuda-btn" class="modern-btn">❓ Ayuda</button>
<!-- AÑADIR ESTO -->
<div id="mensaje-final" class="mensaje-oculto"></div>

<div class="score-panel mensaje-oculto" id="score-panel">
  <h2>🏆 Mejores Tiempos</h2>
  <table>
    <thead>
      <tr>
        <th>Dificultad</th>
        <th>Tiempo (segundos)</th>
      </tr>
    </thead>
    <tbody id="high-scores">
      <!-- Aquí se puede insertar dinámicamente -->
    </tbody>
  </table>
</div>
<!-- Modal de advertencia -->
<div id="advertencia-modal" class="modal oculto">
  <div class="modal-content">
    <h3>⚠️ Advertencia</h3>
    <p>Esta casilla no ha sido deducida como segura.<br>¿Deseas ingresar el número de minas manualmente?</p>
    <div class="modal-buttons">
      <button id="advertencia-confirmar">Sí</button>
      <button id="advertencia-cancelar">No</button>
    
    </div>
  </div>
</div>




<script src="script.js"></script>

</body>
</html>
